name: pogo-monitor

# Scheduled spawn watcher. Runs cloud-monitor.mjs once per tick and exits.
#
# EDIT THESE WITHOUT TOUCHING CODE
#   Settings -> Secrets and variables -> Actions -> Variables
#     SPECIES_IDS   shiny watch. comma-separated dex ids. default 4,1,7
#     SHINY         "true" or "false" — toggle for the SPECIES_IDS pass
#     HUNDO_IDS     SECOND pass, ignores shiny entirely and just watches for
#                   perfect IV. default off. Point this at a common species if
#                   you want the notification path to actually fire.
#     MIN_IV        shared IV floor for both passes. default 100
#   ... and -> Secrets (hidden, do not commit these)
#     POGO_JWT      your pogocoordinates session token
#     NTFY_TOPIC    your ntfy.sh topic name
#
# CRON IS UTC. */5 = every 5 minutes. GitHub may lag a minute or two under
# load — that is normal, not a bug.
#
# Heads-up: GitHub auto-disables scheduled workflows after 60 days with no
# repo activity. Commit anything (even a README typo) to keep it alive.

on:
  schedule:
    # Offset phase (:02,:07,:12,... UTC), NOT */5 — every round minute (:00,
    # :05, ...) is where the Actions scheduler pileup happens and scheduled
    # runs queue 10-20+ min behind. Dodging the round marks measurably cuts
    # the drift. Same 5-min cadence otherwise.
    - cron: "2-57/5 * * * *"
  workflow_dispatch: {}

# Don't let two runs overlap; if a tick is still going, skip the next.
concurrency:
  group: pogo-monitor
  cancel-in-progress: false

# contents:write is needed to commit the seen.json dedupe file back.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the seen.json commit stacks correctly.
          fetch-depth: 0
          # Default GITHUB_TOKEN can't trigger other workflows, which is what
          # we want — this commit should not kick off a second run.
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 20 is deprecated on Actions runners — 22 is the current LTS.
          node-version: "22"

      - name: Run monitor
        env:
          POGO_JWT: ${{ secrets.POGO_JWT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPECIES_IDS: ${{ vars.SPECIES_IDS }}
          HUNDO_IDS: ${{ vars.HUNDO_IDS }}
          MIN_IV: ${{ vars.MIN_IV }}
          SHINY: ${{ vars.SHINY }}
        run: node cloud/cloud-monitor.mjs

      - name: Persist seen store
        # Never fail the run just because dedupe state couldn't be written —
        # worst case is one duplicate alert, which beats a red build.
        #
        # seen.json is force-added: the repo uses an allowlist .gitignore and
        # seen.json is not on it. Also: `git diff` does NOT see untracked
        # files — before 2026-10-11 this step silently never committed and
        # cloud dedupe never persisted. `git status --porcelain` catches it.
        if: always()
        run: |
          git config user.name "pogo-monitor[bot]"
          git config user.email "pogo-monitor@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- seen.json)" ]; then
            echo "seen.json unchanged — nothing to commit"
            exit 0
          fi
          git add -f seen.json
          git commit -m "chore: update seen store [skip ci]" || exit 0
          git push || echo "push failed (likely concurrent run) — non-fatal"
